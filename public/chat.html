<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk to PDF</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        textarea {
            resize: none;
            border: none;
            outline: none;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center overflow-hidden bg-gray-100">
    
    <header class="h-10 bg-rose-200 max-w-2xl w-full flex justify-center items-center shrink-0 border-x-2 border-t-2 border-black">
        <h1 class="capitalize text-xl font-semibold">
            Talk to PDF
        </h1>
    </header>

    <main class="flex-1 max-w-2xl w-full overflow-y-auto bg-purple-300 p-4 flex flex-col gap-4 border-x-2 border-black">
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl self-end shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl self-end shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl self-end shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl self-end shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl self-end shrink-0"></div>
        <div class="w-80 h-20 bg-green-400 rounded-xl shrink-0"></div>
    </main>

    <footer class="w-full max-w-2xl h-20 shrink-0 flex justify-between items-center px-2 bg-white border-2 border-black">
        <textarea placeholder="Ask me anything about your uploaded documents..." class="w-[calc(100%-50px)] h-full p-2" name="ask" id="ask" autocorrect="on" autofocus></textarea>
        <button id="enter-button" class="w-10 h-10 flex justify-center items-center">
            <img class="w-10 h-10 bg-black p-2 rounded-full" src="/send.svg" alt="send image" />
        </button>
    </footer>

    <script src="chat.js"></script>
</body>
</html>
