services:
  rag:
    build: .
    container_name: rag
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src
    depends_on:
      - redis

  worker:
    build: .
    container_name: pdf_worker
    command: ["npm", "run", "dev:worker"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: redis
    volumes:
      - redis-data:/data

volumes:
  redis-data: